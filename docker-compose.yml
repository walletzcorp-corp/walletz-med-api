# Banco de dados PostgreSQL do walletz-med-api
# Uso:
#   docker compose up -d        -> sobe o banco
#   npm run prisma:deploy       -> aplica as migrations do Prisma
#   npx prisma db seed          -> popula regional_configuration
#
# As variáveis abaixo são lidas do arquivo .env (o mesmo do DATABASE_URL).

services:
  postgres:
    image: postgres:16-alpine
    container_name: walletz-med-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-walletzmed}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-walletzmed}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - walletz-med-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  walletz-med-pgdata:
